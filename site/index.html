<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Text-to-Screech Voice Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* AssemblyAI brand, dark: warm black, cream type, Cobolt as the only accent. Oceanic Text,
     UN 11ST and Modern Gothic Mono load if installed; the Google fonts stand in otherwise.
     Layout: one stage that becomes whichever character you pick (cast strip on top), their
     station art in the middle reacting to their voice, prompts and the live transcript below. */
  :root {
    --bg: #1d1b16; --surface: #24221c; --line: #4a4945; --fg: #fdfcf8; --text: #d2d1d0; --muted: #a5a4a2; --label: #c7c3b2;
    --accent: #887bdd; --accent-hover: #b0a7e9; --glow: rgba(57, 35, 199, 0.55); --redact: #f04438;
    --display: "Oceanic Text", "Source Serif 4", Georgia, serif;
    --body: "UN 11ST", system-ui, -apple-system, sans-serif;
    --mono: "Modern Gothic Mono", "JetBrains Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  body[data-char="jack"] { --glow: rgba(232, 121, 42, 0.5); }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.3 var(--body); position: relative; min-height: 100%; overflow-x: clip; }
  .web { position: absolute; top: 0; right: 0; width: min(300px, 46vw); pointer-events: none; }
  .moon { position: absolute; top: 150px; left: max(0px, calc(50% - 560px)); width: 260px; pointer-events: none; }
  @media (max-width: 900px) { .moon { display: none; } }
  .wrap { position: relative; min-height: 100%; max-width: 820px; margin: 0 auto; display: grid; grid-template-rows: auto auto 1fr auto auto; gap: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: max(24px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
  .eyebrow, .when, .tag, .status, .m .w, .asks h2, .redaction { font-family: var(--mono); font-weight: 400; text-transform: uppercase; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header .logo { width: 141px; height: 24px; color: var(--fg); display: block; }
  header .when { font-size: 12px; letter-spacing: 1.2px; color: var(--label); }

  .cast { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .pick { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px 12px; cursor: pointer;
    display: grid; justify-items: center; align-content: start; gap: 4px; font: inherit; transition: border-color 0.2s, background 0.2s; }
  .pick:hover { border-color: var(--muted); }
  .pick img { width: 44px; height: 38px; object-fit: contain; }
  .pick .nm { font: 400 18px/1.1 var(--display); letter-spacing: -0.4px; text-align: center; }
  .pick .tag { font-size: 10px; letter-spacing: 1px; color: var(--accent); }
  .pick[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); }
  .pick:focus-visible, button:focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 2px; }

  .stage { display: grid; justify-items: center; align-content: start; gap: 16px; text-align: center; }
  .stage .eyebrow { font-size: 12px; letter-spacing: 1.2px; color: var(--label); }
  .stage h1 { margin: 0; font: 400 clamp(48px, 12vw, 96px)/0.9 var(--display); letter-spacing: -0.05em; color: var(--fg); text-wrap: balance; }
  .stage .bio { margin: 0; color: var(--text); max-width: 34ch; font-size: clamp(18px, 3.4vw, 22px); }
  .orb { width: min(300px, 70vw); aspect-ratio: 6 / 5; display: grid; place-items: center; }
  .orb img { width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 0 calc(6px + var(--lvl, 0) * 40px) var(--glow));
    transform: scale(calc(1 + var(--lvl, 0) * 0.06)); transition: transform 0.08s linear, filter 0.08s linear; }
  /* The crystal ball is a photo on its own dark backdrop: fade its edges into the page. */
  .orb img[src$=".png"] { -webkit-mask-image: radial-gradient(closest-side, #000 75%, transparent); mask-image: radial-gradient(closest-side, #000 75%, transparent); }
  .orb.sfx img { animation: shake 0.4s infinite; }
  @keyframes shake { 0%, 100% { rotate: 0deg; } 25% { rotate: -4deg; } 75% { rotate: 4deg; } }
  .status { font-size: 12px; color: var(--muted); letter-spacing: 1.2px; min-height: 1.5em; }
  .talk { background: var(--accent); color: var(--bg); border: 1px solid var(--accent); border-radius: 4px; height: 48px; padding: 0 32px; min-width: 240px;
    font: 500 14px var(--mono); letter-spacing: 1.4px; text-transform: uppercase; cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s; }
  .talk:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .talk.live { background: transparent; color: var(--fg); border-color: var(--accent-hover); }
  .talk.live:hover { background: var(--accent); color: var(--bg); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .mute { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; height: 48px; padding: 0 20px;
    font: 500 14px var(--mono); letter-spacing: 1.4px; text-transform: uppercase; cursor: pointer; }
  .mute:hover { border-color: var(--accent-hover); }
  .mute[aria-pressed="true"] { background: var(--redact); border-color: var(--redact); color: #fff; }
  .mute[hidden] { display: none; }
  .hint { font-size: 14px; color: var(--muted); }
  .err { color: var(--redact); font-size: 14px; min-height: 1.2em; }

  .asks { display: grid; gap: 12px; }
  .asks h2 { margin: 0; font-size: 14px; letter-spacing: 1.4px; color: var(--accent); text-align: center; }
  .asks ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 480px) { .asks ul { grid-template-columns: 1fr; } }
  .asks li { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font: 400 clamp(18px, 3.2vw, 22px)/1.15 var(--display); letter-spacing: -0.3px; color: var(--fg); }

  .log { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    min-height: 120px; max-height: 34vh; overflow-y: auto; }
  .log:empty::before { content: "What you both say shows up here."; color: var(--muted); font-size: 14px; margin: auto; }
  .m { max-width: 85%; font-size: 16px; color: var(--fg); overflow-wrap: anywhere; }
  .m .w { display: block; font-size: 11px; letter-spacing: 1.1px; color: var(--muted); }
  .m.char .w { color: var(--accent); }
  .m.you { align-self: flex-end; text-align: right; }
  .m.pending { opacity: 0.6; }
  .chip { background: var(--redact); color: #fff; border-radius: 4px; padding: 0 5px; font: 500 11px var(--mono); }
  .redaction { display: none; font-size: 12px; color: var(--redact); letter-spacing: 1.2px; }
  body[data-char="crypt"] .redaction { display: block; }
  footer { font-size: 14px; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
// Copy and art follow the station signs (the "Halloween station signs" design).
const JACK_ASKS = ["Rhyme my name. Make it hurt.", "Roast my job. I can take it.", "Introduce me like I’m your next guest.", "I bet you can’t make me laugh.", "Roast my coffee order.", "Tell me your oldest joke. Like, 1725 old."];
const CHARACTERS = {
  therapista: { name: "Therapista", art: "/art/crystal-ball.png", station: "Licensed (she says) witch-therapist", bio: "She reads your aura and your vibe, with warm validation and a little sass.", asksTitle: "Try asking her", asks: ["What are my red flags?", "Be honest. Am I the problem?", "What’s my toxic trait?", "Roast my coping mechanisms.", "What does my outfit say about my attachment style?", "Read my aura, and don’t sugarcoat it."], talk: "Sit with Therapista", sfx: ["/api/sound?n=cackle-1", "/api/sound?n=cackle-2"], sfxEvent: "cackle", sfxAfterGreeting: true },
  crypt: { name: "The Crypt Keeper", short: "Crypt Keeper", art: "/art/crypt-keeper.svg", station: "Keeper of the Eternal Vault", bio: "He guards your secrets and reads back only what’s safe: card ending in ****.", asksTitle: "Try asking him", asks: ["Verify my identity. I’m ready.", "Read me my card number. Go on.", "Is my data really safe in your vault?", "I forgot my password. Help.", "Can I withdraw from my soul account?", "Who tried to rob the vault last century?"], talk: "Enter the vault", sfx: ["/api/sound?n=scary"], sfxEvent: "scary_sound", sfxOn: /curses|spirits concur|verified/i, sfxAfterGreeting: true, redact: true },
  // Jack runs on the jack2 agent (the second cloned voice); #jack links still find him.
  jack: { name: "Jack the Roaster", agent: "jack2", art: "/art/pumpkin.svg", spooky: { rate: 0.87, echo: 0.11 }, station: "The pumpkin patch stage", bio: "300 years of stand-up, and he’s sure he’s the funniest comedian alive.", asksTitle: "Try asking him", asks: JACK_ASKS, talk: "Step on stage", sfx: ["/api/sound?n=scream"], sfxEvent: "scream", sfxAfterGreeting: true },
};
const $ = (id) => document.getElementById(id);
let current = "therapista";

// ---------- picking a character ----------
function renderCast() {
  $("cast").innerHTML = Object.entries(CHARACTERS).map(([id, c]) =>
    `<button class="pick" data-id="${id}" aria-pressed="${id === current}"><img src="${c.art}" alt=""><span class="nm">${c.short ?? c.name}</span>${c.tag ? `<span class="tag">${c.tag}</span>` : ""}</button>`).join("");
  $("cast").querySelectorAll(".pick").forEach((b) => b.addEventListener("click", () => pick(b.dataset.id)));
}
function pick(id) {
  if (!CHARACTERS[id]) return;
  const wasLive = !!session;
  if (session) stop();
  current = id;
  const c = CHARACTERS[id];
  document.body.dataset.char = id;
  $("name").textContent = c.name;
  $("station").textContent = c.station;
  $("bio").textContent = c.bio;
  $("orb").innerHTML = `<img src="${c.art}" alt="">`;
  $("asks-h").textContent = c.asksTitle;
  $("asks").innerHTML = c.asks.map((q) => `<li>“${esc(q)}”</li>`).join("");
  $("log").innerHTML = "";
  $("err").textContent = "";
  setLive(false);
  renderCast();
  try { history.replaceState(null, "", "#" + id); } catch {}
  if (wasLive) start();
}

// ---------- transcript ----------
const NUM = "zero|oh|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|thousand|double|triple";
const WORD_RUN = new RegExp(`\\b(?:(?:${NUM})[\\s,\\-]+){2,}(?:${NUM})\\b`, "gi");
const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function fmt(text) {
  let h = esc(text);
  if (CHARACTERS[current].redact) h = h.replace(WORD_RUN, '<span class="chip">REDACTED</span>').replace(/\d[\d\s\-–.,]*\d|\d/g, '<span class="chip">REDACTED</span>');
  return h;
}
let pendingYou = null;
function line(who, text, el) {
  if (!el) { el = document.createElement("div"); el.className = `m ${who}`; $("log").append(el); }
  el.innerHTML = `<span class="w">${who === "you" ? "You" : esc(CHARACTERS[current].name)}</span>${fmt(text)}`;
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

// ---------- audio ----------
const WORKLET = `class Mic extends AudioWorkletProcessor { process(i) { const ch = i[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; } } registerProcessor("mic", Mic);`;
let ctx, analyser, voiceIn, playhead = 0, sources = [], level = 0, raf;
// The cloned voices read every line in a neutral delivery, so a character can ask for a spooky
// one here: played a little slow (deeper and more drawn out), warmer, with a crypt echo.
function voiceChain(spooky) {
  if (!spooky) return analyser;
  const warm = ctx.createBiquadFilter(); warm.type = "lowshelf"; warm.frequency.value = 220; warm.gain.value = 5;
  const dark = ctx.createBiquadFilter(); dark.type = "lowpass"; dark.frequency.value = 6000;
  const delay = ctx.createDelay(1); delay.delayTime.value = spooky.echo;
  const feedback = ctx.createGain(); feedback.gain.value = 0.35;
  const wet = ctx.createGain(); wet.gain.value = 0.3;
  warm.connect(dark).connect(analyser);
  dark.connect(delay).connect(feedback).connect(delay);
  delay.connect(wet).connect(analyser);
  return warm;
}
function playPcm(buf, rate) {
  const pcm = new Int16Array(buf);
  if (!pcm.length) return;
  const f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
  const ab = ctx.createBuffer(1, f.length, rate);
  ab.getChannelData(0).set(f);
  const src = ctx.createBufferSource();
  src.buffer = ab;
  const speed = CHARACTERS[current].spooky?.rate ?? 1;
  src.playbackRate.value = speed;
  src.connect(voiceIn);
  playhead = Math.max(playhead, ctx.currentTime + 0.03);
  src.start(playhead);
  playhead += ab.duration / speed;
  sources.push(src);
  src.onended = () => { sources = sources.filter((s) => s !== src); };
}
const speaking = () => ctx && playhead > ctx.currentTime + 0.02;
function flush() { sources.forEach((s) => { try { s.stop(); } catch {} }); sources = []; playhead = 0; }
function meter() {
  const data = new Uint8Array(analyser.fftSize);
  const tick = () => {
    analyser.getByteTimeDomainData(data);
    let peak = 0;
    for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
    level = level * 0.7 + Math.min(1, peak / 50) * 0.3;
    $("orb").style.setProperty("--lvl", level.toFixed(3));
    $("status").textContent = sfxPlaying ? "…" : muted && !speaking() ? "Muted" : speaking() ? `${CHARACTERS[current].name} is talking` : session?.ready ? "Listening" : $("status").textContent;
    trySfx();
    raf = requestAnimationFrame(tick);
  };
  tick();
}

// Sound effects: played after the character finishes the line, mic muted meanwhile.
let sfxQueue = 0, sfxPlaying = false, sfxNext = 0, spokeOnce = false, sfxQueuedAt = 0;
// One sound per line: the tool call and the line's trigger words (sfxOn) can both ask for it,
// so a sound queued in the last few seconds covers the other. The trigger words make it
// reliable even when the model forgets the tool.
function queueSfx() {
  if (Date.now() - sfxQueuedAt < 6000) return;
  sfxQueuedAt = Date.now();
  sfxQueue++;
}
function trySfx() {
  const c = CHARACTERS[current];
  if (!session || sfxPlaying || !sfxQueue || speaking() || !c.sfx.length) return;
  sfxQueue--;
  sfxPlaying = true;
  $("orb").classList.add("sfx");
  const a = new Audio(c.sfx[sfxNext++ % c.sfx.length]);
  const done = () => { sfxPlaying = false; $("orb").classList.remove("sfx"); };
  a.addEventListener("ended", done, { once: true });
  a.addEventListener("error", done, { once: true });
  a.play().catch(done);
}

// ---------- the session (aai agent protocol, same as the board uses) ----------
let session = null, muted = false;
function setMuted(on) { muted = on; $("mute").setAttribute("aria-pressed", on); $("mute").textContent = on ? "Unmute" : "Mute"; }
function setLive(on) {
  $("talk").textContent = on ? "End" : CHARACTERS[current].talk; $("talk").classList.toggle("live", on);
  $("mute").hidden = !on; setMuted(false);
  if (!on) $("status").textContent = "Tap talk to start";
}

async function start() {
  const who = current;
  $("err").textContent = "";
  setLive(true);
  $("status").textContent = "Waking them up…";
  try {
    ctx ??= new AudioContext();
    await ctx.resume();
    if (!analyser) { analyser = ctx.createAnalyser(); analyser.fftSize = 512; analyser.connect(ctx.destination); }
    voiceIn = voiceChain(CHARACTERS[who].spooky);
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" }))).catch(() => {});
    const t = await fetch(`/api/ticket?c=${CHARACTERS[who].agent ?? who}`, { cache: "no-store" }).then((r) => r.json());
    if (!t.sessionToken) throw new Error(t.error || "Couldn't get a ticket");
    if (who !== current) { stream.getTracks().forEach((x) => x.stop()); return; }
    let client = "web";
    try { client = localStorage.getItem("tts-lab-client") || ("web-" + Math.random().toString(36).slice(2, 10)); localStorage.setItem("tts-lab-client", client); } catch {}
    const ws = new WebSocket(`${t.sessionUrl}?client=${client}&token=${encodeURIComponent(t.sessionToken)}`);
    ws.binaryType = "arraybuffer";
    const s = { ws, stream, micRate: 16000, ttsRate: 24000, ready: false, mic: null, carry: [] };
    session = s;
    sfxQueue = 0; sfxNext = 0; spokeOnce = false;
    const src = ctx.createMediaStreamSource(stream);
    const node = new AudioWorkletNode(ctx, "mic");
    src.connect(node);
    // Through a muted gain to the speakers: some browsers never run a worklet nothing pulls on.
    const sink = ctx.createGain();
    sink.gain.value = 0;
    node.connect(sink).connect(ctx.destination);
    s.mic = { src, node, sink };
    const ratio = () => ctx.sampleRate / s.micRate;
    node.port.onmessage = (e) => {
      if (!s.ready || ws.readyState !== 1) return;
      const input = e.data, r = ratio(), out = new Int16Array(Math.floor(input.length / r));
      for (let i = 0; i < out.length; i++) {
        const v = sfxPlaying || muted ? 0 : input[Math.floor(i * r)];
        out[i] = Math.max(-1, Math.min(1, v)) * 0x7fff;
      }
      ws.send(out.buffer);
    };
    let pendingChar = null;
    ws.onmessage = (ev) => {
      if (session !== s) return;
      if (typeof ev.data !== "string") { playPcm(ev.data, s.ttsRate); return; }
      const m = JSON.parse(ev.data);
      switch (m.type) {
        case "session.configured":
          s.micRate = m.sampleRate || 16000; s.ttsRate = m.ttsSampleRate || 24000;
          ws.send(JSON.stringify({ type: "audio_ready" }));
          s.ready = true;
          $("status").textContent = "Listening";
          break;
        case "userTranscript.updated": case "user-transcript.updated":
          if (m.text) { pendingYou = line("you", m.text, pendingYou); pendingYou.classList.add("pending"); }
          break;
        case "userTranscript.committed": case "user-transcript.committed":
          if (m.text) { pendingYou = line("you", m.text, pendingYou); pendingYou.classList.remove("pending"); }
          pendingYou = null;
          break;
        case "agentTranscript.updated": case "agent-transcript.updated":
          if (m.text) pendingChar = line("char", m.text, pendingChar);
          break;
        case "agentTranscript.committed": case "agent-transcript.committed":
          if (m.text) line("char", m.text, pendingChar);
          pendingChar = null;
          if (!spokeOnce) { spokeOnce = true; if (CHARACTERS[who].sfxAfterGreeting) queueSfx(); }
          else if (m.text && CHARACTERS[who].sfxOn?.test(m.text)) queueSfx();
          break;
        case "reply.cancelled":
          flush();
          break;
        case "custom.emitted":
          if (m.event && m.event === CHARACTERS[who].sfxEvent) queueSfx();
          break;
        case "error.reported":
          if (m.fatal) { $("err").textContent = "The connection dropped. Tap talk to try again."; stop(); }
          break;
        case "session.timedOut": case "session.timed-out":
          stop();
          break;
      }
    };
    ws.onclose = () => { if (session === s) stop(); };
    ws.onerror = () => { if (session === s) $("err").textContent = "Couldn't reach the character. Check your connection and tap talk again."; };
    if (!raf) meter();
  } catch (e) {
    $("err").textContent = e && e.name === "NotAllowedError" ? "Microphone blocked. Allow it in your browser's site settings, then tap talk." : (e?.message || "Something went wrong. Tap talk to try again.");
    stop();
  }
}

function stop() {
  const s = session;
  session = null;
  if (s) {
    try { s.ws.close(); } catch {}
    s.stream?.getTracks().forEach((t) => t.stop());
    try { s.mic?.src.disconnect(); s.mic?.node.disconnect(); s.mic?.sink.disconnect(); } catch {}
  }
  flush();
  sfxQueue = 0;
  sfxQueuedAt = 0;
  setLive(false);
}

$("talk").addEventListener("click", () => (session ? stop() : start()));
$("mute").addEventListener("click", () => setMuted(!muted));
addEventListener("pagehide", stop);
// Old links to the Jack test stations land on Jack.
const asked = { jack2: "jack", jack3: "jack" }[location.hash.slice(1)] ?? location.hash.slice(1);
pick(CHARACTERS[asked] ? asked : "therapista");
</script>
</body>
</html>
